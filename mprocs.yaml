procs:
  supabase:
    # Local Supabase stack: Postgres :54322, auth+storage :54321, Studio :54323.
    # One-shot — containers daemonize under Docker (OrbStack); re-run anytime.
    shell: supabase start
  web:
    # The one app: marketing site + admin + client portal + API. :3001 locally.
    shell: cd web && bun run dev

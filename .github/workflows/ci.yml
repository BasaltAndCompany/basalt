name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # deploy gate: Fly Deploy (dashboard) fires only after this succeeds
    paths: ['dashboard/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      # install at the workspace root: dashboard imports @basalt/ui from packages/ui
      - run: bun install
      - working-directory: dashboard
        run: bun run test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - run: bun install
      - working-directory: dashboard
        run: bun run typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # repo-root context: dashboard/Dockerfile copies the workspace packages
          context: .
          file: dashboard/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

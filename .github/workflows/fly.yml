name: Fly Deploy (dashboard)
# Branch protection is paywalled on the free org plan, so prod is guarded
# here instead: deploy only lands after CI (test + typecheck + docker-build)
# is green on main, and at the exact SHA that was tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # repo root is the build context (dashboard imports the @basalt/ui
      # workspace package); the Dockerfile builds dashboard/.output
      - run: flyctl deploy --remote-only --config dashboard/fly.toml --dockerfile dashboard/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Basalt</title>
<link rel="stylesheet" href="ink.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Crect x='3' y='9' width='7' height='23' fill='%23FAFAFA'/%3E%3Crect x='12.5' y='2' width='7' height='30' fill='%23C8102E'/%3E%3Crect x='22' y='12' width='7' height='20' fill='%23FAFAFA'/%3E%3C/svg%3E">
</head>
<body>
<div class="login-shell">
  <div class="card login-card">
    <div class="login-brand">
      <!-- Brand mark: middle pillar takes the signal red (the brand's one color) -->
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <rect x="3" y="9" width="7" height="23"/>
        <rect x="12.5" y="2" width="7" height="30" fill="#C8102E"/>
        <rect x="22" y="12" width="7" height="20"/>
      </svg>
      <div>
        <div class="login-brand-name">Basalt</div>
        <div class="login-brand-sub">Portal</div>
      </div>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="muted" style="margin:0 0 24px;font-size:14px">Sign in to access your dashboard.</p>

    <form onsubmit="return false">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@company.com" spellcheck="false" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-block" type="submit" style="margin-top:8px">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>

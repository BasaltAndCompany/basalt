<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Basalt</title>
<link rel="stylesheet" href="ink.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Ctext x='14' y='47' font-family='Georgia, serif' font-size='46' fill='%23FAFAFA'%3EB%3C/text%3E%3Ccircle cx='53' cy='43' r='5' fill='%23C8102E'/%3E%3C/svg%3E">
</head>
<body>
<div class="login-shell">
  <div class="card login-card">
    <div class="login-brand">
      <div class="login-brand-name">Basalt<span class="dot">.</span></div>
      <div class="login-brand-sub">Portal</div>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="muted" style="margin:0 0 24px;font-size:14px">Sign in to access your dashboard.</p>

    <form onsubmit="return false">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@company.com" spellcheck="false" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-block" type="submit" style="margin-top:8px">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>

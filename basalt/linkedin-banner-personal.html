<!doctype html>
<!-- Collin's PERSONAL LinkedIn banner. 1584×396. Value prop + social proof,
     per the dibratto 90-day framework. Basalt brand: ink, Bodoni italic, one red dot.
     Render: basalt/linkedin-banner-personal.png via headless Chrome. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Bodoni Moda Variable";
    src: url("../node_modules/.bun/@fontsource-variable+bodoni-moda@5.3.0/node_modules/@fontsource-variable/bodoni-moda/files/bodoni-moda-latin-opsz-normal.woff2") format("woff2");
    font-weight: 400 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Geist Variable";
    src: url("../node_modules/.bun/@fontsource-variable+geist@5.3.0/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  .stage {
    position: relative;
    width: 1584px;
    height: 396px;
    background: #0A0A0A;
    color: #FAFAFA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* nudge right of center: LinkedIn avatar overlaps the bottom-left */
    padding-left: 120px;
  }
  /* B. brand mark, corner. Georgia like the favicon. Top-left: avatar owns bottom-left. */
  .brand {
    position: absolute;
    left: 64px;
    top: 44px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: #FAFAFA;
  }
  .brand .dot { color: #C8102E; }
  .prop {
    font-family: "Bodoni Moda Variable", "Bodoni MT", Georgia, serif;
    font-style: normal;
    font-variation-settings: "opsz" 15;
    font-weight: 560;
    font-size: 88px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .prop .dot { color: #C8102E; font-style: normal; }
  .proof {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .proof .label {
    font-family: "Geist Variable", sans-serif;
    font-size: 16px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: rgba(250, 250, 250, 0.55);
  }
  .proof .trident { height: 32px; width: auto; }
  .proof .favicon { height: 32px; width: auto; }
  /* recolor the black IU wordmark to paper white, keep shapes exact */
  .proof .iulogo { height: 32px; width: auto; filter: brightness(0) invert(1); }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">B<span class="dot">.</span></div>
    <div class="prop">AI-Native, For Working Businesses<span class="dot">.</span></div>
    <div class="proof">
      <span class="label">Proven from public institutions to start-ups</span>
      <img class="favicon" src="cdl-favicon.png" alt="Customs Data Lock" />
      <img class="iulogo" src="iu-logotype.svg" alt="Indiana University" />
    </div>
  </div>
</body>
</html>
